<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: hsl(212, 45%, 89%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
    }

    .container {
      background-color: hsl(0, 0%, 100%);
      border-radius: 20px;
      padding: 2rem;
      text-align: center;
      max-width: 340px;
    }

    .qr-code {
      width: calc(100% + 12px);
      height: auto;
      margin-left: -6px;
      border-radius: 12px;
    }

    .title {
      font-size: 1.4rem;
      margin: 1rem 0;
      color: hsl(218, 44%, 22%);
      font-weight: 700;
    }

    .description {
      font-size: 15px;
      line-height: 1.4;
      color: hsl(216, 15%, 48%);
    }

    .attribution {
      font-size: 0.6875rem;
      text-align: center;
      color:  hsl(216, 15%, 48%);
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
      text-decoration: none;
    }

  </style>
</head>

<body>

  <main>

    <div class="container">

      <img src="./images/image-qr-code.png" alt="Frontend Mentor QR code" class="qr-code">

      <h1 class="title">Improve your front-end skills by building projects</h1>

      <p class="description">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>

    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://www.frontendmentor.io/profile/tanuluthra4">Tanu Luthra</a>.
  </footer>
</body>

</html>
